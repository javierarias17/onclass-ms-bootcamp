services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: onclass-keycloak
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak/onclass-realm.json:/opt/keycloak/data/import/onclass-realm.json:ro
