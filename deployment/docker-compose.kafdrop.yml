x-kafka-common: &kafka-common
  image: apache/kafka:3.9.0
  environment: &kafka-common-env
    CLUSTER_ID: "xpzTdN2uTWWh4L_HTnhf0w"
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 2
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

services:
  kafka1:
    <<: *kafka-common
    container_name: onclass-kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:29092,PLAINTEXT_HOST://localhost:9092"

  kafka2:
    <<: *kafka-common
    container_name: onclass-kafka2
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:29092,PLAINTEXT_HOST://localhost:9093"

  kafka3:
    <<: *kafka-common
    container_name: onclass-kafka3
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: "PLAINTEXT://:29092,CONTROLLER://:29093,PLAINTEXT_HOST://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:29092,PLAINTEXT_HOST://localhost:9094"

  kafka-topic-init:
    image: apache/kafka:3.9.0
    container_name: onclass-kafka-topic-init
    depends_on:
      - kafka1
      - kafka2
      - kafka3
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka1:29092,kafka2:29092,kafka3:29092 > /dev/null 2>&1; do
          echo 'Esperando a que el cluster de Kafka este listo...'
          sleep 2
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:29092,kafka2:29092,kafka3:29092 --create --if-not-exists --topic bootcamp.report.requested --partitions 3 --replication-factor 2
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka1:29092,kafka2:29092,kafka3:29092 --describe --topic bootcamp.report.requested

  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: onclass-kafdrop
    ports:
      - "8085:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka1:29092,kafka2:29092,kafka3:29092"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      - kafka1
      - kafka2
      - kafka3
